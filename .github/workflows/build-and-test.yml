name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Auto-cancel any old in-progress runs for the same PR, but not for non-PR runs
concurrency:
  group: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Windows, since the client's tests run on .NET Framework too. The tests that call the live service are left out (see README).
  windows:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest
    name: windows-x64-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
    - name: Clean
      run: dotnet clean Singulink.Cryptography.Pwned.slnx --configuration ${{ matrix.configuration }} && dotnet nuget locals all --clear
    - name: Install dependencies
      run: dotnet restore Singulink.Cryptography.Pwned.slnx
    - name: Build
      run: dotnet build Singulink.Cryptography.Pwned.slnx --configuration ${{ matrix.configuration }} --no-restore
    - name: Test
      run: dotnet test Singulink.Cryptography.Pwned.slnx --configuration ${{ matrix.configuration }} --no-build --verbosity normal
